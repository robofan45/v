[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "resumeflow"
version = "1.0.0"
description = "Cross-platform desktop app for tracking context switches and resuming focus"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5.0",
    "psutil>=5.9.0",
    "pygetwindow>=0.0.9;sys_platform=='win32'",
    "pyobjc-framework-Cocoa>=9.0;sys_platform=='darwin'",
]

[project.scripts]
resumeflow = "resumeflow.app:main"

[tool.setuptools.packages.find]
include = ["resumeflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

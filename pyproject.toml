[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeflow"
version = "1.0.0"
description = "Cross-platform desktop app for tracking context switches and resuming focus"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["productivity", "focus", "context-switch", "desktop", "PyQt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "PyQt6>=6.5.0",
    "psutil>=5.9.0",
    "pygetwindow>=0.0.9;sys_platform=='win32'",
    "pyobjc-framework-Cocoa>=9.0;sys_platform=='darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
resumeflow = "resumeflow.app:main"

[project.gui-scripts]
resumeflow-gui = "resumeflow.app:main"

[tool.setuptools.packages.find]
include = ["resumeflow*"]

[tool.setuptools.package-data]
resumeflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
